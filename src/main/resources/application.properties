spring.application.name=cafeteria-backend
server.port=8080
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=cafe
spring.jpa.properties.hibernate.default_schema=cafe
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.default-property-inclusion=non_null
app.jwt.secret=${JWT_SECRET:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Correo: con BREVO_API_KEY se envia por la API de Brevo; sin ella, los correos se muestran en la consola.
app.correo.brevo-api-key=${BREVO_API_KEY:}
app.correo.remitente=${CORREO_REMITENTE:cafe.14.catorce@gmail.com}
app.correo.nombre=Cafe Catorce
# Direccion publica del sitio: se usa en los enlaces y en la imagen QR de los correos.
app.url-publica=${APP_URL:http://localhost:8080}
