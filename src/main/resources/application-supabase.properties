spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Solo PostgreSQL/Supabase: callback que bloquea la Data API sobre el esquema cafe tras cada migracion.
spring.flyway.locations=classpath:db/migration,classpath:db/supabase
# La base de Supabase ya tiene la carta real: no volver a sembrar datos de ejemplo.
app.datos-demo=false
