<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del empleado — Café Catorce</title>
  <link rel="stylesheet" href="/empleado/panel.css">
</head>
<body>
  <aside><a class="marca" href="/">CAFÉ CATORCE</a><p>Espacio del empleado</p><nav aria-label="Panel del empleado"><a href="#mesas" aria-current="page">Consulta de mesas</a><a href="/">Ver cafetería</a></nav><button id="salir" type="button">Cerrar sesión</button></aside>
  <main>
    <header><div><p class="etiqueta">OPERACIÓN DEL LOCAL</p><h1>Consulta de mesas</h1><p id="perfil">Validando sesión…</p></div><button id="actualizar" type="button" disabled>Actualizar mesas</button></header>
    <p id="aviso" role="status">Cargando…</p>
    <section class="resumen" aria-label="Resumen de mesas"><article><span>Total de mesas</span><strong id="total">—</strong></article><article><span>Disponibles</span><strong id="disponibles">—</strong></article><article><span>Plazas totales</span><strong id="plazas">—</strong></article></section>
    <section id="mesas" class="panel"><div class="titulo"><h2>Distribución del local</h2><label>Estado <select id="filtro"><option value="">Todos</option><option value="DISPONIBLE">Disponible</option><option value="OCUPADA">Ocupada</option><option value="RESERVADA">Reservada</option></select></label></div><div id="lista" class="mesas"></div><p class="nota">Vista de consulta. Usa Actualizar mesas para obtener el estado más reciente del local.</p></section>
  </main>
  <script src="/comun/auth.js"></script><script src="/empleado/panel.js"></script>
</body>
</html>
