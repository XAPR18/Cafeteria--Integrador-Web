<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <title>Panel Admin - Café Catorce</title>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="marca">
                <span class="punto"><i class="fa-solid fa-mug-hot"></i></span>
                <span><b>CAFÉ CATORCE</b><span>Panel de administración</span></span>
            </div>
            <h1>Iniciar sesión</h1>
            <p class="sub">Acceso exclusivo del administrador.</p>

            <form id="form-admin-login">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" value="admin" required>
                </div>
                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primario">Entrar al panel</button>
            </form>

            <p class="login-nota">
                <i class="fa-solid fa-circle-info"></i>
                Maqueta del primer avance: cualquier dato entra al panel.
                La autenticación real (Spring Security + JWT + roles) llega en un avance posterior.
            </p>
        </div>
    </div>

    <script src="../comun/config.js"></script>
    <script>
      document.getElementById("form-admin-login").addEventListener("submit", (e) => {
        e.preventDefault();
        sessionStorage.setItem("cafe14-admin", "1");
        window.location.href = "panel.html";
      });
    </script>
</body>
</html>
