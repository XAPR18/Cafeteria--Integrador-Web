<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <title>Panel Admin - Café Catorce</title>
</head>
<body>
    <div class="app">
        <aside class="side">
            <div class="marca">
                <span class="punto"><i class="fa-solid fa-mug-hot"></i></span>
                <span><b>CAFÉ CATORCE</b><span>Administración</span></span>
            </div>
            <nav id="nav">
                <a class="nav-item" data-vista="secciones"><i class="fa-solid fa-layer-group"></i> Secciones</a>
                <a class="nav-item" data-vista="productos"><i class="fa-solid fa-mug-saucer"></i> Productos</a>
                <a class="nav-item" data-vista="mesas"><i class="fa-solid fa-chair"></i> Mesas</a>
            </nav>
            <div class="pie">
                <a class="salir" href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</a>
                <p style="margin-top:.8rem">v1 · Primer avance</p>
            </div>
        </aside>

        <main class="contenido">
            <div class="encabezado">
                <div>
                    <h1 id="titulo-vista">Secciones</h1>
                    <p id="sub-vista">Categorías del menú de la cafetería.</p>
                </div>
                <button class="btn-nuevo" id="btn-nuevo"><i class="fa-solid fa-plus"></i> <span id="btn-nuevo-txt">Nueva sección</span></button>
            </div>

            <div class="kpis" id="kpis"></div>

            <div class="error-barra" id="error-barra" hidden></div>

            <div class="tabla-caja">
                <table>
                    <thead><tr id="thead-fila"></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="cargando" id="cargando">Cargando…</div>
                <div class="vacio" id="vacio" hidden>No hay registros todavía.</div>
            </div>
        </main>
    </div>

    <!-- Modal de formulario -->
    <div class="modal-fondo" id="modal-fondo" hidden>
        <div class="modal">
            <header>
                <h3 id="modal-titulo">Nuevo</h3>
                <button type="button" id="modal-cerrar" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <form id="modal-form">
                <div class="cuerpo" id="modal-campos"></div>
                <footer>
                    <button type="button" class="btn-sec" id="modal-cancelar">Cancelar</button>
                    <button type="submit" class="btn-primario" style="width:auto;padding:.7rem 1.4rem" id="modal-guardar">Guardar</button>
                </footer>
            </form>
        </div>
    </div>

    <script src="../comun/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/panel.js"></script>
</body>
</html>
