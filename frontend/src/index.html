<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Café Catorce — Cafetería de especialidad de barrio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Café de especialidad, desayunos y repostería de la casa. Revisa la carta y reserva tu mesa en línea.">
  <meta name="theme-color" content="#1e1712">
  <link rel="icon" type="image/svg+xml" href="Image/Café 14 - logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Pantalla de carga: se ve al instante, antes de que Angular arranque. App la oculta al estar lista. -->
  <div id="precarga" class="precarga" role="status" aria-label="Cargando Café Catorce">
    <div class="precarga__caja">
      <svg class="precarga__taza" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="pc-cafe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8935a"/><stop offset=".18" stop-color="#6b3f1f"/><stop offset="1" stop-color="#2a170b"/></linearGradient>
          <clipPath id="pc-vaso"><path d="M30 48 h52 l-5 46 a8 8 0 0 1 -8 7 h-26 a8 8 0 0 1 -8 -7 z"/></clipPath>
        </defs>
        <path class="precarga__vapor" d="M48 36 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="#e6ce9e" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <path class="precarga__vapor" d="M58 38 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="#e6ce9e" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <path class="precarga__vapor" d="M68 36 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="#e6ce9e" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <rect class="precarga__chorro" x="54" y="0" width="5" height="60" rx="2.5" fill="url(#pc-cafe)"/>
        <g clip-path="url(#pc-vaso)"><rect class="precarga__liquido" x="25" y="52" width="62" height="52" fill="url(#pc-cafe)"/></g>
        <path d="M30 48 h52 l-5 46 a8 8 0 0 1 -8 7 h-26 a8 8 0 0 1 -8 -7 z" fill="rgba(255,255,255,.06)" stroke="#d4ad70" stroke-width="3"/>
        <path d="M81 58 h6 a10 10 0 0 1 0 22 h-8" fill="none" stroke="#d4ad70" stroke-width="3"/>
        <ellipse cx="56" cy="104" rx="38" ry="5" fill="none" stroke="#d4ad70" stroke-width="3" opacity=".6"/>
      </svg>
      <span class="precarga__marca">CAFÉ&nbsp;CATORCE</span>
      <span class="precarga__barra"><span></span></span>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
